<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>柴狐消消乐</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; font-family:"PingFang SC","Microsoft Yahei",sans-serif; }
  body {
    background:linear-gradient(160deg,#7c3aed 0%,#c4b5fd 42%,#fde047 100%);
    display:flex; align-items:center; justify-content:center;
  }
  #hearts { position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  #app { position:relative; width:100%; max-width:420px; height:100%; max-height:880px; display:flex; flex-direction:column; padding:14px 14px 26px; }
  .heart { position:absolute; bottom:-30px; font-size:20px; opacity:.5; pointer-events:none; animation:floatUp linear infinite; }
  @keyframes floatUp {
    0%{ transform:translateY(0) translateX(0) rotate(0); opacity:0; }
    10%{ opacity:.5; }
    90%{ opacity:.4; }
    100%{ transform:translateY(-110vh) translateX(30px) rotate(20deg); opacity:0; }
  }

  header { text-align:center; margin-bottom:6px; z-index:2; }
  header h1 { color:#fff; font-size:26px; font-weight:900; letter-spacing:2px; text-shadow:0 2px 0 #7e22ce, 0 3px 6px rgba(0,0,0,.2); }
  header .sub { color:#fff; font-size:13px; opacity:.95; margin-top:3px; }
  .topbar { display:flex; align-items:center; justify-content:center; margin:6px 2px 10px; z-index:2; gap:10px; }
  .levelbar { background:rgba(255,255,255,.88); border-radius:14px; padding:5px 10px; font-weight:800; color:#7e22ce; font-size:13px; white-space:nowrap; flex-shrink:1; }
  .progress { background:rgba(255,255,255,.7); border-radius:14px; padding:5px 8px; font-weight:700; color:#7e22ce; font-size:12px; white-space:nowrap; }
  .btn-reset { background:#fff; border:none; border-radius:14px; padding:6px 12px; font-weight:700; color:#7e22ce; font-size:13px; cursor:pointer; }

  #board { position:relative; flex:1; width:100%; min-height:260px; z-index:1; }
  .tile {
    position:absolute; width:56px; height:56px; border-radius:14px;
    background:#fff; box-shadow:0 3px 6px rgba(126,34,206,.25);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .12s, opacity .12s;
  }
  .tile img { width:82%; height:82%; object-fit:contain; pointer-events:none; }
  .tile.blocked { filter:brightness(.62) saturate(.8); cursor:not-allowed; }
  .tile.blocked::after { content:""; position:absolute; inset:0; border-radius:14px; background:rgba(80,40,120,.18); }
  .tile:hover { transform:translateY(-3px); }
  .tile.clearing { animation:pop .28s forwards; }
  @keyframes pop { 50%{transform:scale(1.15)} 100%{transform:scale(0); opacity:0;} }

  #tray {
    margin-top:12px; background:rgba(255,255,255,.35); border:3px solid #fff; border-radius:20px;
    padding:10px; display:flex; gap:8px; justify-content:center; min-height:76px; z-index:2;
  }
  .slot { width:56px; height:56px; border-radius:14px; background:rgba(255,255,255,.25); border:2px dashed rgba(255,255,255,.6); }
  .slot.filled { border:none; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 6px rgba(126,34,206,.25); }
  .slot.filled img { width:46px; height:46px; object-fit:contain; }

  #boost { display:flex; gap:10px; margin-top:12px; z-index:2; }
  .boost { flex:1; border:none; border-radius:16px; padding:11px 6px; font-weight:800; font-size:15px; color:#fff; cursor:pointer; box-shadow:0 4px 0 rgba(126,34,206,.35); }
  .boost:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(126,34,206,.35); }
  .boost.b1 { background:linear-gradient(135deg,#a855f7,#c084fc); }
  .boost.b2 { background:linear-gradient(135deg,#d97706,#fbbf24); }
  .boost.b3 { background:linear-gradient(135deg,#7c3aed,#8b5cf6); }
  .boost:disabled { opacity:.4; cursor:not-allowed; }
  .boost .count { font-size:12px; opacity:.85; }

  .overlay { position:absolute; inset:0; background:rgba(76,29,149,.55); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; padding:24px; text-align:center; }
  .overlay.hidden { display:none; }
  .overlay h2 { color:#fff; font-size:30px; font-weight:900; margin-bottom:10px; text-shadow:0 2px 6px rgba(0,0,0,.3); }
  .overlay p { color:#fff; font-size:15px; margin-bottom:22px; }
  #regionGrid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; width:90%; max-width:320px; }
  .regionBtn { background:#fff; color:#7e22ce; border:none; border-radius:14px; padding:12px 8px; font-weight:800; font-size:15px; cursor:pointer; }
  .regionInput { width:100%; background:#fff; color:#7e22ce; border:none; border-radius:14px; padding:12px 8px; font-weight:800; font-size:15px; text-align:center; outline:none; }
  #home .ginput { width:80%; max-width:280px; padding:12px 16px; border-radius:16px; border:none; font-size:16px; text-align:center; margin:10px 0 18px; outline:none; }
  #home .again { margin:8px 6px 0; }
  #home .ghost { background:#fff; color:#7e22ce; }
  .overlay .again { background:#fde047; color:#7e22ce; border:none; border-radius:18px; padding:14px 34px; font-size:17px; font-weight:800; cursor:pointer; margin-top:6px; }
</style>
</head>
<body>
<div id="app">
  <div id="hearts"></div>

  <header>
    <h1>柴狐消消乐</h1>
    <div class="sub">点选瓷砖放进托盘，三个相同就消除，通关全部关卡！</div>
  </header>

  <div class="topbar">
    <div class="levelbar" id="levelbar">第 1 关 / 共 8 关</div>
    <div class="progress" id="progress">剩余 18</div>
  </div>

  <div id="board"></div>

  <div id="tray"></div>

  <div id="boost">
    <button class="boost b1" id="bRemove" onclick="boostRemove()">移出3张<br><span class="count" id="cRemove">×2</span></button>
    <button class="boost b2" id="bUndo" onclick="boostUndo()">撤回<br><span class="count" id="cUndo">×3</span></button>
    <button class="boost b3" onclick="boostShuffle()">打乱顺序</button>
  </div>

  <div class="overlay" id="home">
    <h2>🐥 柴狐消消乐</h2>
    <p>输入小鸡群ID，和好友加入同一个小鸡群一起挑战</p>
    <input id="groupId" class="ginput" placeholder="输入小鸡群ID">
    <button class="again" onclick="joinGroup()">加入小鸡群</button>
    <button class="again ghost" onclick="goSolo()">单人闯关</button>
  </div>

  <div class="overlay hidden" id="regionPanel" style="background:rgba(139,92,246,.96);">
    <h2>🐔 进入小鸡群</h2>
    <p>选一个区域群，或自己填写群名加入</p>
    <div id="regionGrid">
      <button class="regionBtn" onclick="joinGroupById('浙江群')">浙江群</button>
      <button class="regionBtn" onclick="joinGroupById('上海群')">上海群</button>
      <button class="regionBtn" onclick="joinGroupById('江苏群')">江苏群</button>
      <button class="regionBtn" onclick="joinGroupById('广东群')">广东群</button>
      <button class="regionBtn" onclick="joinGroupById('北京群')">北京群</button>
      <button class="regionBtn" onclick="joinGroupById('四川群')">四川群</button>
      <button class="regionBtn" onclick="joinGroupById('湖南群')">湖南群</button>
      <input class="regionInput" id="regionInput" placeholder="自定义群名">
    </div>
    <button class="again" onclick="joinSelected()">加入该群</button>
  </div>

  <div class="overlay hidden" id="overlay">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <button class="again" id="ovBtn" onclick="ovAction()"></button>
  </div>
</div>

const ALL_TYPES = Object.keys(TILES);
const TW = 56, TH = 56;

// 8 关：types 用到几种，tiles 总数，layers 层数
const LEVELS = Array.from({length:1299},(_,i)=>{
  if(i===0) return { types:4, tiles:18, layers:1 };
  if(i===1) return { types:11, tiles:48, layers:3 };
  const types = Math.min(11, 6+Math.floor(i/4));
  let layers = 3;
  if(i>=8) layers=4;
  if(i>=25) layers=5;
  let tiles = Math.min(120, 48 + i*6);
  tiles = Math.ceil(tiles/3)*3;
  return { types, tiles, layers };
});
let mode='solo', groupId='', groupLevel=0;
let R = Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function seedFromString(s){let h=2166136264;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function groupCfg(g){
  if(g===0) return { types:4, tiles:18, layers:1 };
  if(g===1) return { types:11, tiles:48, layers:3 };
  let layers = 3;
  if(g>=8) layers=4;
  if(g>=25) layers=5;
  let tiles = Math.min(120, 48 + g*6);
  tiles = Math.ceil(tiles/3)*3;
  return { types:11, tiles, layers };
}
let tiles=[], tray=[], history=[], level=0;
let uses = { remove:2, undo:3 };
let locked = false;
let sf = 1;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildLevel(){
  const cfg = mode==='group' ? groupCfg(groupLevel) : LEVELS[level];
  // 从全部10款里随机挑出本关用到的种类，保证新角色也会出现
  const pool = shuffle(ALL_TYPES.slice()).slice(0, Math.min(cfg.types, ALL_TYPES.length));
  // 构造类型池：每3个一组，保证每种出现次数为3的倍数，最终可清空
  const typePool = [];
  for(let i=0;i<cfg.tiles/3;i++){
    const t = pool[i % pool.length];
    typePool.push(t, t, t);
  }
  shuffle(typePool);

  const result = [];
  const total = cfg.tiles;
  let n0 = total, n1 = 0, n2 = 0, n3 = 0, n4 = 0;
  if(cfg.layers>=2){ n1 = Math.round(total*0.30); n0 = total - n1; }
  if(cfg.layers>=3){ n2 = Math.round(total*0.18); n1 = n1 - n2; n0 = total - n1 - n2; }
  if(cfg.layers>=4){ n3 = Math.round(total*0.14); n2 = n2 - n3; n0 = total - n1 - n2 - n3; }
  if(cfg.layers>=5){ n4 = Math.round(total*0.10); n3 = n3 - n4; n0 = total - n1 - n2 - n3 - n4; }

  let id = 0;
  const add=(layer,x,y)=>{ result.push({ id:id++, type:'', layer, x, y, state:'board' }); };
  // 第0层：网格
  for(let i=0;i<n0;i++){
    const col = i%6, row = Math.floor(i/6);
    add(0, col*58, row*58);
  }
  // 第1层：随机压在上面
  for(let i=0;i<n1;i++){ add(1, 40+R()*280, 20+R()*220); }
  // 第2层：少量
  for(let i=0;i<n2;i++){ add(2, 80+R()*220, 40+R()*180); }
  for(let i=0;i<n3;i++){ add(3, 110+R()*160, 70+R()*130); }
  for(let i=0;i<n4;i++){ add(4, 130+R()*120, 90+R()*100); }
  result.forEach((t,i)=>{ t.type = typePool[i%typePool.length]; });
  return result;
}

function covered(t){
  return tiles.some(u=> u.state==='board' && u.layer>t.layer &&
    Math.abs(u.x-t.x)<TW*0.72*sf && Math.abs(u.y-t.y)<TH*0.72*sf);
}

function startLevel(){
  tiles = buildLevel();
  tray = []; history = [];
  uses = { remove:2, undo:3 };
  locked = false;
  document.getElementById('overlay').classList.add('hidden');
  render();
}
function joinGroup(){
  document.getElementById('home').classList.add('hidden');
  showRegions();
}
function goSolo(){
  mode='solo'; groupId=''; R=Math.random; level=0;
  document.getElementById('home').classList.add('hidden');
  startLevel();
}
const REGIONS=['浙江群','上海群','江苏群','广东群','北京群','四川群','湖南群'];
let pickedRegion='';
function showRegions(){
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('home').classList.add('hidden');
  document.getElementById('regionPanel').classList.remove('hidden');
}
function joinGroupById(name){
  groupId=name; mode='group'; groupLevel=0;
  R=mulberry32(seedFromString('chickgroup:'+name+'0'));
  document.getElementById('regionPanel').classList.add('hidden');
  document.getElementById('home').classList.add('hidden');
  document.getElementById('overlay').classList.add('hidden');
  startLevel();
}
function joinSelected(){
  const v=(document.getElementById('regionInput').value||'').trim();
  if(v){ joinGroupById(v); }
  else if(pickedRegion){ joinGroupById(pickedRegion); }
}
function backHome(){
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
}
function restartLevel(){ startLevel(); }
function init(){
  const board = document.getElementById('board');
  board.addEventListener('click', e=>{
    let node = e.target;
    while(node && node!==board){
      if(node.classList && node.classList.contains('tile')){
        const t = tiles.find(x=>x.id===+node.dataset.tid);
        if(t) pick(t, node);
        break;
      }
      node = node.parentElement;
    }
  });
  document.getElementById('home').classList.remove('hidden');
}

function render(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const bw = board.clientWidth || 360;
  sf = Math.min(1.35, Math.max(0.95, bw/330));
  const sorted = [...tiles].sort((a,b)=>a.layer-b.layer);
  sorted.forEach(t=>{
    if(t.state!=='board') return;
    const el = document.createElement('div');
    el.className = 'tile' + (covered(t)?' blocked':'');
    el.style.left = (t.x*sf) + 'px';
    el.style.top = (t.y*sf) + 'px';
    el.style.width = (TW*sf)+'px';
    el.style.height = (TH*sf)+'px';
    el.dataset.tid = t.id;
    el.innerHTML = `<img src="${TILES[t.type]}" alt="">`;
    board.appendChild(el);
  });

  const trayEl = document.getElementById('tray');
  trayEl.innerHTML = '';
  for(let i=0;i<7;i++){
    const slot = document.createElement('div');
    const t = tray[i];
    if(t){ slot.className='slot filled'; slot.innerHTML=`<img src="${TILES[t.type]}">`; }
    else slot.className='slot';
    trayEl.appendChild(slot);
  }

  const left = tiles.filter(t=>t.state==='board').length;
    document.getElementById('levelbar').textContent = mode==='group' ? `小鸡群 ${groupId} · 第 ${groupLevel+1} 关/${LEVELS.length}` : `第 ${level+1} 关 / ${LEVELS.length} 关`;
  document.getElementById('progress').textContent = `剩 ${left}`;
  document.getElementById('cRemove').textContent = '×'+uses.remove;
  document.getElementById('cUndo').textContent = '×'+uses.undo;
  document.getElementById('bRemove').disabled = uses.remove<=0;
  document.getElementById('bUndo').disabled = uses.undo<=0;
}

function pick(t, el){
  if(locked || t.state!=='board') return;
  t.state='tray';
  tray.push(t);
  history.push({tile:t, from:'board'});
  render();
  checkMatch();
}

function checkMatch(){
  const counts = {};
  tray.forEach(t=>{ counts[t.type]=(counts[t.type]||0)+1; });
  const triple = Object.keys(counts).find(k=>counts[k]>=3);
  if(triple){
    locked = true;
    const group = tray.filter(t=>t.type===triple).slice(0,3);
    group.forEach(t=>{ t.state='clear'; });
    setTimeout(()=>{
      tray = tray.filter(t=>t.state!=='clear');
      locked = false;
      render();
      afterMove();
    }, 260);
  } else { afterMove(); }
}

function afterMove(){
  const boardLeft = tiles.some(t=>t.state==='board');
  if(!boardLeft && tray.length===0){ return levelClear(); }
  if(tray.length>=7){ return fail(); }
}

function levelClear(){
  locked = true;
  if(mode==='group'){
    if(groupLevel < LEVELS.length-1){
      document.getElementById('ovTitle').textContent = `🎉 本群第 ${groupLevel+1} 关通过！`;
      document.getElementById('ovText').textContent = `继续挑战小鸡群「${groupId}」，共 ${LEVELS.length} 关`;
      document.getElementById('ovBtn').textContent = '下一群关';
      document.getElementById('ovBtn').onclick = ()=>{
        groupLevel++;
        R=mulberry32(seedFromString('chickgroup:'+groupId+groupLevel));
        startLevel();
      };
      setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),250);
    } else {
      document.getElementById('ovTitle').textContent = '🏆 小鸡群全部通关！';
      document.getElementById('ovText').textContent = `「${groupId}」${LEVELS.length} 关全部通过，宝宝太厉害啦！`;
      document.getElementById('ovBtn').textContent = '返回主页';
      document.getElementById('ovBtn').onclick = ()=>{ backHome(); };
      setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),300);
    }
    return;
  }
  if(level === LEVELS.length-1){
    document.getElementById('ovTitle').textContent = '🎉 恭喜宝宝通关！';
    document.getElementById('ovText').textContent = `${LEVELS.length} 关全部通过，宝宝太厉害啦！`;
    document.getElementById('ovBtn').textContent = '从头再玩';
    document.getElementById('ovBtn').onclick = ()=>{ init(); };
    setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),300);
  } else {
    document.getElementById('ovTitle').textContent = `🎉 第 ${level+1} 关通过！`;
    document.getElementById('ovText').textContent = `准备进入第 ${level+2} 关`;
    if(level===1){
      document.getElementById('ovTitle').textContent = '🎉 第二关通过！';
      document.getElementById('ovText').textContent = '选择区域小鸡群加入挑战';
      document.getElementById('ovBtn').textContent = '选择区域小鸡群';
      document.getElementById('ovBtn').onclick = ()=>{ showRegions(); };
      setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),250);
    } else {
      document.getElementById('ovBtn').textContent = '下一关';
      document.getElementById('ovBtn').onclick = ()=>{ level++; startLevel(); };
      setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),250);
    }
  }
}

function fail(){
  locked = true;
  document.getElementById('ovTitle').textContent = '😵 托盘满了';
  document.getElementById('ovText').textContent = '差一点点，本关再试一次吧！';
  document.getElementById('ovBtn').textContent = mode==='group' ? '重试本群' : '重开';
  document.getElementById('ovBtn').onclick = ()=>{
    if(mode==='group'){ R=mulberry32(seedFromString('chickgroup:'+groupId+groupLevel)); }
    startLevel();
  };
  setTimeout(()=>document.getElementById('overlay').classList.remove('hidden'),300);
}

function boostRemove(){
  if(uses.remove<=0 || tray.length===0) return;
  const take = tray.splice(0,3);
  take.forEach(t=>{ t.state='board'; history.push({tile:t, from:'tray'}); });
  uses.remove--;
  render(); afterMove();
}
function boostUndo(){
  if(uses.undo<=0 || history.length===0) return;
  const last = history.pop();
  const t = last.tile;
  if(last.from==='board'){ t.state='board'; tray = tray.filter(x=>x!==t); }
  else { t.state='tray'; tray.push(t); }
  uses.undo--;
  render();
}
function boostShuffle(){
  const onBoard = tiles.filter(t=>t.state==='board');
  const types = onBoard.map(t=>t.type);
  shuffle(types);
  onBoard.forEach((t,i)=>t.type=types[i]);
  render();
}

function spawnHearts(){
  const box=document.getElementById('hearts');
  const emojis=['💜','💛'];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    s.className='heart';
    s.textContent=emojis[i%2];
    s.style.left=(Math.random()*96)+'%';
    s.style.fontSize=(14+Math.random()*14)+'px';
    const dur=9+Math.random()*8;
    s.style.animationDuration=dur+'s';
    s.style.animationDelay=(-Math.random()*dur)+'s';
    box.appendChild(s);
  }
}
function ovAction(){}
spawnHearts();
init();
</script>
